<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Praxisverwaltung</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Paints the signed-in user's theme before the first byte is rendered.
      //
      // It reads a COOKIE, not localStorage, and that is the whole point: the
      // theme is stored on the user, so a browser that has never run this
      // application cannot know it — and asking the API means at least one
      // request, which means a first paint in the wrong scheme. The server
      // writes `praxi_theme` in the same response as the session cookie, so
      // from the first load after signing in the answer is already here.
      //
      // Source of truth for the value set is
      // packages/shared/src/user-preferences.ts (themeOptions) — duplicated
      // here on purpose, because nothing can be imported this early; keep the
      // two in sync by hand. Absent means slate, the same convention
      // components/theme-picker.tsx and cookies.ts keep.
      ;(() => {
        var THEME_OPTIONS = ['blue', 'sage', 'rose', 'night']
        var found = document.cookie.match(/(?:^|;\s*)praxi_theme=([^;]*)/)
        var theme = found ? decodeURIComponent(found[1]) : null
        if (theme && THEME_OPTIONS.indexOf(theme) !== -1) {
          document.documentElement.dataset.theme = theme
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
