# Postgres only. The application itself is never containerised.
services:
  postgres:
    image: postgres:18-alpine
    container_name: praxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: praxi
      POSTGRES_PASSWORD: praxi
      POSTGRES_DB: praxi
      # Deterministic collation, so ORDER BY on contact names does not depend
      # on the host locale.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=de-DE --encoding=UTF8'
    ports:
      # Host port 55432 is deliberately unusual: it cannot clash with a locally
      # installed Postgres (5432) or another project's compose file (5433).
      - '55432:5432'
    volumes:
      # One mount at /var/lib/postgresql, not at .../data — the 18 image places
      # the cluster in a major-version subdirectory below it
      # (/var/lib/postgresql/18/docker), so that `pg_upgrade --link` does not
      # have to cross a mount boundary. Mounting .../data as before makes 18
      # refuse to start and say so at length.
      - ./.docker-data/postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U praxi -d praxi']
      interval: 5s
      timeout: 5s
      retries: 10
