<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/praxi-app-design-system-421ea7b6-3fda-414b-a9bd-88972c75107c/fonts/fonts.css">
<link rel="stylesheet" href="_ds/praxi-app-design-system-421ea7b6-3fda-414b-a9bd-88972c75107c/_ds_bundle.css">
<link rel="stylesheet" href="_ds/praxi-app-design-system-421ea7b6-3fda-414b-a9bd-88972c75107c/styles.css">
<link rel="stylesheet" href="theme.css">
<script src="_ds/praxi-app-design-system-421ea7b6-3fda-414b-a9bd-88972c75107c/_ds_bundle.js"></script>
<style>
button{cursor:pointer}
button:not([data-slot]){font:inherit;color:inherit;background:none;border:0;padding:0;text-align:inherit}
</style>
</helmet>
<aside style="display:flex;width:{{ breite }};height:100%;flex-direction:column;flex-shrink:0;border-right:1px solid var(--border);background:var(--sidebar);font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--foreground);transition:width .16s ease">
<div style="display:flex;align-items:center;gap:8px;justify-content:{{ ausrichtung }};padding:14px 14px 13px;border-bottom:1px solid var(--border);min-height:57px">
<sc-if value="{{ offen }}" hint-placeholder-val="{{ true }}">
<div style="flex:1;min-width:0">
<p style="margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em">Praxi</p>
<p style="margin:1px 0 0;color:var(--muted-foreground);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ praxis }}</p>
</div>
</sc-if>
<button onClick="{{ toggle }}" title="{{ toggleTitel }}" aria-label="{{ toggleTitel }}" style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;border-radius:6px;color:var(--muted-foreground)" style-hover="background:var(--accent);color:var(--accent-foreground)">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path><path d="{{ toggleIcon }}"></path></svg>
</button>
</div>
<nav style="display:flex;flex-direction:column;gap:2px;flex:1;padding:12px 10px;overflow:auto">
<sc-for list="{{ items }}" as="item" hint-placeholder-count="9">
<a href="{{ item.ziel }}" title="{{ item.label }}" style="display:flex;align-items:center;gap:11px;justify-content:{{ ausrichtung }};padding:7px 11px;border-radius:6px;text-decoration:none;white-space:nowrap;overflow:hidden;background:{{ item.bg }};color:{{ item.fg }};font-weight:{{ item.fw }}" style-hover="background:var(--accent);color:var(--accent-foreground)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="{{ item.d }}"></path></svg>
<sc-if value="{{ offen }}" hint-placeholder-val="{{ true }}"><span>{{ item.label }}</span></sc-if>
</a>
</sc-for>
</nav>
</aside>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:236,&quot;height&quot;:720},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Übersicht&quot;,&quot;Kontakte&quot;,&quot;Kalender&quot;,&quot;Vorgänge&quot;,&quot;Abrechenbar&quot;,&quot;Rechnungen&quot;,&quot;Bezahlübersicht&quot;,&quot;Leistungen&quot;,&quot;Einstellungen&quot;],&quot;default&quot;:&quot;Kontakte&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eingeklappt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;praxis&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Praxis Ostertor&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;benutzer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Hendrik Beneke&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
/** Navigation wie in `apps/web/src/routes/_app.tsx`: Reihenfolge und Beschriftung
 *  aus `strings.nav`, das Geld in der Reihenfolge, in der es sich bewegt. */
const NAV = [
  {label:'Übersicht', d:'M4 4h6v6H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 14h6v6H4z'},
  {label:'Kontakte', ziel:'Kontaktliste.dc.html', d:'M15 20v-1.5A3.5 3.5 0 0 0 11.5 15h-4A3.5 3.5 0 0 0 4 18.5V20M9.5 5.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.4'},
  {label:'Kalender', ziel:'Terminkalender.dc.html', d:'M4 5h16v15H4zM8 3v4M16 3v4M4 10h16'},
  {label:'Vorgänge', ziel:'Vorgänge.dc.html', d:'M15 4h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 3h6v3H9zM9 12h6M9 16h4'},
  {label:'Zahlungen', ziel:'Zahlungen.dc.html', d:'M14.5 9.6a5.5 5.5 0 1 1-5 8.8M4 9.5a5 5 0 1 0 10 0 5 5 0 0 0-10 0'},
  {label:'Leistungen', ziel:'Leistungen.dc.html', d:'M5 4v5a5 5 0 0 0 10 0V4M10 14v2a4 4 0 0 0 8 0v-1M18 11a2 2 0 1 0 .01 0'},
  {label:'Einstellungen', ziel:'Einstellungen.dc.html', d:'M4 7h9M17 7h3M4 17h5M13 17h7M15 5v4M11 15v4'}
];
/** Einmal gewählt, bleibt der Zustand beim Screenwechsel bestehen. */
const KEY = 'praxi.sidebar.collapsed';

class Component extends DCLogic {
  state = {eingeklappt: null};

  componentDidMount(){
    try {
      const saved = window.localStorage.getItem(KEY);
      if (saved !== null) this.setState({eingeklappt: saved === '1'});
    } catch (e) {}
  }

  get eingeklappt(){
    return this.state.eingeklappt ?? this.props.eingeklappt === true;
  }

  toggle = () => {
    const next = !this.eingeklappt;
    this.setState({eingeklappt: next});
    try { window.localStorage.setItem(KEY, next ? '1' : '0'); } catch (e) {}
  };

  renderVals(){
    const zu = this.eingeklappt;
    const active = this.props.active ?? 'Kontakte';
    return {
      offen: !zu,
      breite: zu ? '62px' : '236px',
      ausrichtung: zu ? 'center' : 'flex-start',
      toggleIcon: zu ? 'M14 9l3 3-3 3' : 'M17 9l-3 3 3 3',
      toggleTitel: zu ? 'Navigation ausklappen' : 'Navigation einklappen',
      toggle: this.toggle,
      praxis: this.props.praxis ?? 'Praxis Ostertor',
      benutzer: this.props.benutzer ?? 'Hendrik Beneke',
      items: NAV.map(item => ({
        ...item,
        // Nur gebaute Screens führen wirklich irgendwohin.
        ziel: item.ziel ?? '#',
        bg: item.label === active ? 'var(--accent)' : 'transparent',
        fg: item.label === active ? 'var(--accent-foreground)' : 'var(--muted-foreground)',
        fw: item.label === active ? '600' : '400'
      }))
    };
  }
}

</script>
</body>
</html>
