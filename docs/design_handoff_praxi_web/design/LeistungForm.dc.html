<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/praxi-app-design-system-421ea7b6-3fda-414b-a9bd-88972c75107c/fonts/fonts.css">
<link rel="stylesheet" href="_ds/praxi-app-design-system-421ea7b6-3fda-414b-a9bd-88972c75107c/_ds_bundle.css">
<link rel="stylesheet" href="_ds/praxi-app-design-system-421ea7b6-3fda-414b-a9bd-88972c75107c/styles.css">
<link rel="stylesheet" href="theme.css">
<script src="_ds/praxi-app-design-system-421ea7b6-3fda-414b-a9bd-88972c75107c/_ds_bundle.js"></script>
<style>
button{cursor:pointer}
button:not([data-slot]){font:inherit;color:inherit;background:none;border:0;padding:0;text-align:inherit}
</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:18px;font-family:var(--font-sans);font-size:14px;color:var(--foreground)">
<div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px 18px">
<div style="grid-column:1/span 3;display:flex;flex-direction:column;gap:5px">
<x-import component-from-global-scope="PraxiWeb.Label" htmlFor="lf-kuerzel" hint-size="50px,16px">Kürzel</x-import>
<x-import component-from-global-scope="PraxiWeb.Input" id="lf-kuerzel" dc-props="{{ form.kuerzelProps }}" hint-size="100%,36px"></x-import>
<p style="margin:0;color:var(--muted-foreground);font-size:12px">Optional, für die Schnellauswahl.</p>
</div>
<div style="grid-column:4/span 9;display:flex;flex-direction:column;gap:5px">
<x-import component-from-global-scope="PraxiWeb.Label" htmlFor="lf-text" hint-size="86px,16px">Bezeichnung</x-import>
<x-import component-from-global-scope="PraxiWeb.Input" id="lf-text" dc-props="{{ form.textProps }}" hint-size="100%,36px"></x-import>
</div>
<div style="grid-column:1/span 3;display:flex;flex-direction:column;gap:5px">
<x-import component-from-global-scope="PraxiWeb.Label" htmlFor="lf-ziffer" hint-size="96px,16px">Ziffer (GebüH)</x-import>
<x-import component-from-global-scope="PraxiWeb.Input" id="lf-ziffer" dc-props="{{ form.zifferProps }}" hint-size="100%,36px"></x-import>
</div>
<div style="grid-column:4/span 3;display:flex;flex-direction:column;gap:5px">
<x-import component-from-global-scope="PraxiWeb.Label" htmlFor="lf-preis" hint-size="40px,16px">Preis</x-import>
<x-import component-from-global-scope="PraxiWeb.Input" id="lf-preis" className="text-right tabular-nums" dc-props="{{ form.preisProps }}" hint-size="100%,36px"></x-import>
<p style="margin:0;color:var(--muted-foreground);font-size:12px">In Euro, zum Beispiel 90,00</p>
</div>
<div style="grid-column:7/span 3;display:flex;flex-direction:column;gap:5px">
<x-import component-from-global-scope="PraxiWeb.Label" htmlFor="lf-dauer" hint-size="110px,16px">Dauer in Minuten</x-import>
<x-import component-from-global-scope="PraxiWeb.Input" id="lf-dauer" type="number" dc-props="{{ form.dauerProps }}" hint-size="100%,36px"></x-import>
<p style="margin:0;color:var(--muted-foreground);font-size:12px">Leer lassen, wenn es keine übliche Dauer gibt.</p>
</div>
<div style="grid-column:10/span 3;display:flex;flex-direction:column;gap:5px">
<label style="display:flex;align-items:center;gap:9px;height:36px;cursor:pointer">
<x-import component-from-global-scope="PraxiWeb.Checkbox" dc-props="{{ form.aktivProps }}" hint-size="16px,16px"></x-import>Aktiv
</label>
<p style="margin:0;color:var(--muted-foreground);font-size:12px">Inaktive Leistungen erscheinen in keiner Auswahlliste.</p>
</div>
</div>
<div style="display:flex;justify-content:flex-end;gap:10px;padding-top:12px;border-top:1px solid var(--border)">
<x-import component-from-global-scope="PraxiWeb.Button" variant="ghost" onClick="{{ form.onAbbrechen }}" hint-size="106px,36px">Abbrechen</x-import>
<x-import component-from-global-scope="PraxiWeb.Button" onClick="{{ form.onSpeichern }}" hint-size="108px,36px">Speichern</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:260},&quot;form&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
/** Das Formular einer Leistung — im Katalog an zwei Stellen gezeigt:
 *  beim Anlegen über der Tabelle und beim Bearbeiten in der Zeile. */
class Component extends DCLogic {
  renderVals(){ return {}; }
}
</script>
</body>
</html>
